name: "AMCHECK"

on:
  repository_dispatch:
    types: [check]

  # Fast path for changed apps: repository_dispatch (or manual dispatch) with
  # what_test set to the changed app names tests only those apps; the hourly
  # sweep covers the remainder. There is no push trigger in this repo because
  # install scripts live in the AM repo, not here.
  workflow_dispatch:
    inputs:
      reset_stats:
        description: "RESET stats"
        required: true
        default: false
        type: boolean
      retest_excluded:
        description: "TEST excluded"
        required: true
        default: false
        type: boolean
      what_test:
        description: "App names: (space between)"
        required: false
        default: ""
        type: string
      how_many:
        description: "Number of apps: (max 500)"
        required: false
        default: ''
        type: integer

  schedule:
    - cron: '0 * * * *'
    # Enable ONLY after a full TOTEST=500 run completes in under 25 minutes wall-clock
    # (read from run duration in the Actions UI) AND owner accepts ~2x runner minutes:
    # - cron: '*/30 * * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

env:
  REPO: ${{ github.repository_owner }}/AM
  BRANCH: main
  TOTEST: 500
  CHUNK_SIZE: 10

jobs:
  triggered:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: "Remotely triggered"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.client_payload.ref }}

      - name: "Show payload"
        run: echo ${{ github.event.client_payload.sha }} >> $GITHUB_STEP_SUMMARY

  show-stats:
    name: "stats 📝"
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.count.outputs.all }}
      tested: ${{ steps.stats.outputs.tested }}
      excluded: ${{ steps.stats.outputs.excluded }}
    steps:
      - name: "Checkout AM"
        if: github.event.inputs.reset_stats != 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REPO }}

      - name: "Count programs 📊"
        if: github.event.inputs.reset_stats != 'true'
        id: count
        run: |
          grep -v "\"kdegames\"\|\"kdeutils\"\|\"node\"\|\"platform-tools\"\| ffwa-\|am-utils" programs/x86_64-apps | awk '{print $2}' | sort -u > appslist
          x64Count=$(wc -l < appslist)
          echo "all=$x64Count" >> $GITHUB_OUTPUT

      - name: "Upload appslist"
        if: github.event.inputs.reset_stats != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: appslist
          path: appslist
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Reset stats"
        if: github.event.inputs.reset_stats == 'true'
        run: |
          echo "### stats RESET" >> $GITHUB_STEP_SUMMARY
          rm -rf results
          git config --global user.name web-flow
          git config --global user.email "noreply@github.com"
          git rm -r results
          git commit -m "reset stats"
          git push --force
          git clean -f

      - name: "Count stats 📊"
        if: github.event.inputs.reset_stats != 'true'
        id: stats
        run: |
          if [ -f results/tested ]; then
            tested=$(wc -l < results/tested)
          else
            tested='0'
          fi
          if [ -f results/excluded ]; then
            excluded=$(wc -l < results/excluded)
          else
            excluded='0'
          fi
          echo "tested=$tested" >> $GITHUB_OUTPUT
          echo "excluded=$excluded" >> $GITHUB_OUTPUT

      - name: "Show stats 📊"
        if: github.event.inputs.reset_stats != 'true'
        run: |
          echo "### 🎬 apps: ${{ steps.count.outputs.all }}" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.stats.outputs.tested }}" != '0' ]]; then
            echo "🔨 tests:" >> $GITHUB_STEP_SUMMARY
            echo " 🏁 ${{ steps.stats.outputs.tested }}" >> $GITHUB_STEP_SUMMARY
          fi
          if [[ "${{ steps.stats.outputs.excluded }}" != '0' ]]; then
            echo " ❌ ${{ steps.stats.outputs.excluded }} (excluded)" >> $GITHUB_STEP_SUMMARY
          fi

  generate-matrix:
    name: "matrix 🌀"
    if: github.event.inputs.reset_stats != 'true'
    needs: show-stats
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.set-matrix.outputs.skip }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Download appslist"
        uses: actions/download-artifact@v8
        with:
          name: appslist

      - name: "Generate Matrix 🏆"
        id: set-matrix
        run: |
          if [[ -f results/tested ]]; then
            echo "tested exist"
            if diff -q appslist results/tested; then
              echo "Everything checked"
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            else
              echo "Getting temp list"
              comm --check-order -23 appslist results/tested > totest_tmp.list
            fi
          else
            echo "First run!"
            cp appslist totest_tmp.list
          fi
          if [[ -f results/excluded ]]; then
            echo "Excluded exists"
            comm --check-order -23 totest_tmp.list results/excluded > totest.list
            if [ ! -s totest.list ]; then
              echo "List is empty"
              echo " 🏁 Nothing to test 🏁" >> $GITHUB_STEP_SUMMARY
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          else
            echo "Creating new list"
            mv totest_tmp.list totest.list
          fi
          TOTEST_LIST=$(mktemp)
          if [ ! -z "${{ github.event.inputs.what_test }}" ]; then
            echo "Testing only: ${{ github.event.inputs.what_test }}"
            echo "${{ github.event.inputs.what_test }}" | tr ' ' '\n' | grep -v '^$' | sort -u > "$TOTEST_LIST"
          elif [ "${{ github.event.inputs.retest_excluded }}" == 'true' ]; then
            echo "Testing excluded"
            if [ -f results/excluded ]; then
              cat results/excluded | tr ' ' '\n' | grep -v '^$' | sort -u > "$TOTEST_LIST"
            else
              echo "Nothing excluded!"
              echo "Nothing excluded!" >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
          else
            if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              echo "Used workflow dispatch"
              how_many="${{ github.event.inputs.how_many }}"
              if [ -z "$how_many" ]; then
                echo "Don't have numbers"
                how_many="${{ env.TOTEST }}"
              fi
            else
              echo "Shedule or push?"
              echo "how_many=${{ env.TOTEST }}"
              how_many=${{ env.TOTEST }}
              if [ -z "$how_many" ]; then
                echo "Still don't exist"
                how_many="$TOTEST"
              fi
            fi
            head -n "$how_many" totest.list > "$TOTEST_LIST" || cp totest.list "$TOTEST_LIST"
          fi
          echo '-------------------------------------------------------------'
          echo 'Testing files:'
          echo '-------------------------------------------------------------'
          cat "$TOTEST_LIST"
          echo '-------------------------------------------------------------'
          CHUNK_SIZE="${CHUNK_SIZE:-10}"
          i=0; n=0; chunk_files=""
          MATRIX="{\"include\": ["
          while IFS= read -r app || [ -n "$app" ]; do
            [ -z "$app" ] && continue
            if [ -z "$chunk_files" ]; then chunk_files="$app"; else chunk_files="$chunk_files $app"; fi
            n=$((n+1))
            if [ "$n" -ge "$CHUNK_SIZE" ]; then
              MATRIX+="{\"chunk\": \"$i\", \"files\": \"$chunk_files\"},"
              i=$((i+1)); n=0; chunk_files=""
            fi
          done < "$TOTEST_LIST"
          if [ -n "$chunk_files" ]; then
            MATRIX+="{\"chunk\": \"$i\", \"files\": \"$chunk_files\"},"
          fi
          MATRIX="${MATRIX%,}]}"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          cp "$TOTEST_LIST" totest_selected.list
          rm -f "$TOTEST_LIST"

      - name: "Upload totest list"
        if: ${{ steps.set-matrix.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: totest
          path: totest_selected.list
          if-no-files-found: error
          retention-days: 1

  static-checks:
    name: "static 🔍"
    needs: generate-matrix
    if: ${{ needs.generate-matrix.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Checkout AM"
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REPO }}

      - name: "Checkout AMCHECK"
        uses: actions/checkout@v7
        with:
          path: amcheck

      - name: "Download totest"
        uses: actions/download-artifact@v8
        with:
          name: totest

      - name: "Static checks"
        working-directory: programs/x86_64
        run: |
          set -uo pipefail
          mkdir -p "$GITHUB_WORKSPACE/static"
          grep -v '^#' "$GITHUB_WORKSPACE/amcheck/.github/amcheck-blocklist.txt" > /tmp/blocklist || true
          while IFS= read -r app || [ -n "$app" ]; do
            [ -z "$app" ] && continue
            out="$GITHUB_WORKSPACE/static/out-$app"
            echo "APP=\"$app\"" >> "$out"
            if grep -qe "appimage-extract\|mage\$\|tmp/\*mage" "$app" 1>/dev/null; then
              echo "APPIMAGE='yes'" >> "$out"
            else
              echo "APPIMAGE='no'" >> "$out"
            fi
            if grep -q "api.github.com" "$app" 2>/dev/null; then
              echo "GITHUB='yes'" >> "$out"
            else
              echo "GITHUB='no'" >> "$out"
            fi
            if grep -q "^SITE=" "$app" 2>/dev/null; then
              SITE=$(eval echo "$(grep -i '^SITE=' "$app" | head -1 | sed 's/SITE=//g')")
              echo "SITE=\"$SITE\"" >> "$out"
            fi
            if echo "$app" | grep -Eqf /tmp/blocklist; then
              echo "$app: blocklisted, install skipped" >> "$out"
              echo "$app" >> "$GITHUB_WORKSPACE/static/ko-$app"
            fi
          done < "$GITHUB_WORKSPACE/totest_selected.list"

      - name: "Upload static results"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: static
          path: static
          retention-days: 1

  run-actions:
    name: "🔨"
    needs: [generate-matrix, static-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: ${{ needs.generate-matrix.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    env:
      TIMEOUT: 23
    steps:
      - name: "Checkout AM"
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REPO }}

      - name: "Checkout AMCHECK"
        uses: actions/checkout@v7
        with:
          path: amcheck

      - name: "Download static results"
        uses: actions/download-artifact@v8
        with:
          name: static
          path: programs/x86_64/static

      - name: "Setup runner"
        uses: ./amcheck/.github/actions/setup-runner

      - name: "Checkout repository"
        uses: actions/checkout@v7
        with:
          path: results

      - name: "Create directory"
        working-directory: programs/x86_64
        run: |
          echo "Creating results directory"
          mkdir -p results

      - name: "test chunk ${{ matrix.chunk }} 🚧"
        id: test
        working-directory: programs/x86_64
        run: |
          set -uo pipefail
          CHUNK="${{ matrix.chunk }}"
          mkdir -p results/job-$CHUNK
          for app in ${{ matrix.files }}; do
            start=$(date +%s)
            TIMEOUT_S=$(( ${TIMEOUT:-23} * 60 ))
            out="results/job-$CHUNK/out-$app"
            if [ -f "static/ko-$app" ]; then
              cat "static/out-$app" >> "$out"
              echo "$app" >> "results/job-$CHUNK/ko-$app"
              echo "DURATION=$(( $(date +%s) - start ))" >> "$out"
              continue
            fi
            cat "static/out-$app" >> "$out"

          # Static greps moved into the "test chunk" loop above.

          # Enter developer mode
          #am --devmode-enable

          # Define the content of the script || Alow testing non existent (for workflow tests)
          script_content=$(cat $app) || echo "Testing non exist file! (for workflow test only)"
          # Define the pure name of the app
          pure_arg=$(echo "$app" | sed 's/\-appimage$//g' | sed 's:.*/::')

          # Allow installing applications even if the command already exists
          sed -i '/command -v "$pure_arg"/d; /command already exists/d' /opt/am/modules/install.am

          # Special patches
          if [[ "$pure_arg" =~ (node|npm) ]]; then
            sed -i 's/_check_if_script_installs_a_metapackage || return 1//g' /opt/am/modules/install.am
          fi

          #########################
          # INSTALL THE APPLICATION
          #########################

          # Blocklist enforced by the static-checks job; install every app that reaches here.
          
            if grep -qe "^read \|SITE1=" "$app" 1>/dev/null || [[ "$pure_arg" =~ (wine) ]]; then

              echo 1 | timeout "$TIMEOUT_S" am -i "$app" --debug 2>&1
              ARGSNUMB=$(find /opt -maxdepth 2 -name 'remove' -print 2>/dev/null | sed 's|/remove||g' | tr ' ' '\n' | wc -l)
              if [ "$ARGSNUMB" = 1 ]; then
                sleep 10
                echo 1 | timeout "$TIMEOUT_S" am -i "$app" --debug 2>&1
              fi

            elif [[ "$pure_arg" =~ (bat-extras) ]]; then

              echo y | timeout "$TIMEOUT_S" am -i bat "$app" --debug 2>&1
              ARGSNUMB=$(find /opt -maxdepth 2 -name 'remove' -print 2>/dev/null | sed 's|/remove||g' | tr ' ' '\n' | wc -l)
              if [ "$ARGSNUMB" = 1 ]; then
                sleep 10
                echo y | timeout "$TIMEOUT_S" am -i bat "$app" --debug 2>&1
              fi

            else

              echo y | timeout "$TIMEOUT_S" am -i "$app" --debug 2>&1
              ARGSNUMB=$(find /opt -maxdepth 2 -name 'remove' -print 2>/dev/null | sed 's|/remove||g' | tr ' ' '\n' | wc -l)
              if [ "$ARGSNUMB" = 1 ]; then
                sleep 10
                echo y | timeout "$TIMEOUT_S" am -i "$app" --debug 2>&1
              fi

            fi

            LASTDIR=$(ls -td /opt/* | head -1 | sed 's:.*/::')

            # If an application is blacklisted, ignore it
            if [ "$LASTDIR" = am ]; then
              echo "### 💀 $app" >> $GITHUB_STEP_SUMMARY
              echo "$app" >> results/job-$CHUNK/log-$app
              echo "$app" >> results/job-$CHUNK/ko-$app
              echo "DURATION=$(( $(date +%s) - start ))" >> "$out"
              continue

            # If the last modified directory contains a file named "remove", check the installed files
            elif test -f /opt/"$LASTDIR"/remove; then

              printf "\n-------------------------------------------------------------\n\n"

              # Check structure of directories in /opt
              echo " Structure of the directory in /opt"
              echo ""
              ls /opt/"$LASTDIR" | tee -a results/log-"$app"

              # Try to upload the icons (you need to uncomment the "Upload icons" workflow to have them, see below)
              if test -f /opt/"$LASTDIR"/icons/*; then
                mkdir -p results/icons
                cp -r /opt/"$LASTDIR"/icons/* results/icons/
              fi

              printf "\n-------------------------------------------------------------\n\n"

              # Check the command in /usr/local/bin
              echo " Command in \$PATH"
              echo ""
              command -v "$pure_arg" | tee -a results/log-"$app" || command -v "$LASTDIR" | tee -a results/log-"$app" || ls /usr/local/bin | tee -a results/log-"$app"

              printf "\n-------------------------------------------------------------\n\n"

              # Check launchers in /usr/local/share/applications
              echo " Launchers in /usr/local/share/applications" | tee -a results/log-"$app"
              echo ""
              if [ -n "$(find /usr/local/share/applications/ -type f -name *AM.desktop 2>/dev/null)" ]; then
                 find /usr/local/share/applications/ -type f -name *AM.desktop | tee -a results/log-"$app"
              elif echo "$script_content" | grep -q -- '^./"$APP" --appimage-extract.*./"$APP".desktop$'; then
                 ls /usr/local/share/applications | grep "AM.desktop$" | tee -a results/log-"$app"
              else
                 echo "No .desktop file available" | tee -a results/log-"$app"
              fi

              printf "\n-------------------------------------------------------------\n\n"

              # Remove the application
              am -R "$LASTDIR" && echo "$app" >> results/job-$CHUNK/ok-$app || { echo "$app" >> results/job-$CHUNK/log-$app; echo "$app" >> results/job-$CHUNK/ko-$app; }

            # Any other result is a failure
            else
              echo "$app install produced no removable directory" | tee -a results/job-$CHUNK/log-$app
              echo "$app" >> results/job-$CHUNK/ko-$app
              echo "DURATION=$(( $(date +%s) - start ))" >> "$out"
              continue
            fi
          echo "DURATION=$(( $(date +%s) - start ))" >> "$out"
          done

      - name: "Upload chunk results ⬆️"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-chunk-${{ matrix.chunk }}
          path: programs/x86_64/results/job-${{ matrix.chunk }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  update-results:
    name: "results 📰"
    needs: run-actions
    runs-on: ubuntu-latest
    if: (always() && github.event.inputs.reset_stats != 'true')
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Download results ⬇️"
        uses: actions/download-artifact@v8
        with:
          path: results
          merge-multiple: true

      - name: "Download appslist"
        uses: actions/download-artifact@v8
        with:
          name: appslist

      - name: "Git Config"
        run: |
          git config --global user.name web-flow
          git config --global user.email "noreply@github.com"

      - name: "Process log results"
        run: |
          mkdir -p results
          for LogFile in results/out-* results/job-*/out-*; do
            echo '-----------------------------------------------------------------'
            echo "$LogFile out"
            echo '-----------------------------------------------------------------'
            [ -f "$LogFile" ] && cat "$LogFile"
            echo '-----------------------------------------------------------------'
            [ -f "$LogFile" ] || continue
            jobdir=$(dirname "$LogFile")
            appname=$(basename "$LogFile" | cut -d'-' -f2-)
            echo '-----------------------------------------------------------------'
            echo "$appname"
            echo '-----------------------------------------------------------------'
            if [ -z "$size" ]; then
              size=$(cat "$LogFile" | grep 'size' | cut -d'=' -f2)
              echo "size is $size"
            fi
            KoFile="$jobdir/ko-$appname"
            if [[ -f "$KoFile" ]]; then
              echo "$appname" | tee -a failing results/excluded
              rm -f "$KoFile"
              cat "$LogFile" | grep -E '(^.*=.*$|^.*----.*$)' >> results/log
              sort -u results/excluded -o results/excluded
              sort -u failing -o failing
              git add results/excluded
            else
              cat "$LogFile" | grep -E '(^.*=.*$|^.*----.*$)' >> results/log
              echo "$appname" >> results/tested
            fi
            echo '-----------------------------------------------------------------' >> results/log
            rm -f "$LogFile" "$jobdir/log-$appname" "$jobdir/ok-$appname"
          done
          sort -u results/tested -o results/tested
          rm -rf results/job-* results/icons results/out-* results/ok-* results/ko-* results/log-*
          git add results
          if git status --porcelain | grep -v -e 'results/tested$' -e 'results/tested.prev$' -e 'results/excluded$' -e 'results/log$' | grep -q '^A '; then
            echo "unexpected new tracked file under results/"
            exit 1
          fi

      - name: "Show results"
        if: ${{ needs.generate-matrix.outputs.skip != 'true' && github.event.inputs.reset_stats != 'true' }}
        run: |
          if [[ -f results/tested ]]; then
            tested=$(wc -l < results/tested 2>/dev/null || echo 0)
          else
            tested='0'
          fi
          if [[ -f results/excluded ]]; then
            excluded=$(wc -l < results/excluded 2>/dev/null || echo 0)
          else
            excluded='0'
          fi
          if [[ -f failing ]]; then
            fail=$(wc -l < failing 2>/dev/null || echo 0)
          else
            fail='0'
          fi
          count=$(wc -l < appslist)
          remaining=$((count - tested - excluded))
          (( remaining < 0 )) && remaining=0
          echo "🏁 $tested tested" >> $GITHUB_STEP_SUMMARY
          if [[ "$fail" != '0' ]]; then
            echo ":x: $fail excluded now" >> $GITHUB_STEP_SUMMARY
          fi
          if [[ "$excluded" != '0' ]]; then
            echo "😱 $excluded excluded" >> $GITHUB_STEP_SUMMARY
          fi
          echo "### 🛅 $remaining to test" >> $GITHUB_STEP_SUMMARY
          rm -f appslist
          rm -f results/ok-*
          echo '-----------------------------------------------------------------'
          echo "Missed results:"
          echo '-----------------------------------------------------------------'
          ls -R results/
          echo '-----------------------------------------------------------------'

      - name: "Push"
        if: ${{ needs.generate-matrix.outputs.skip != 'true' }}
        run: |
          git config --global user.name web-flow
          git config --global user.email "noreply@github.com"
          if [[ "$GITHUB_REF" == 'refs/pull/*' ]]; then
            echo "This is a Pull Request. Not saving results."
            exit 0
          elif git diff-index --quiet HEAD; then
            echo "No changes to commit." >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            git add results
            git commit -m "check"
            git push --force-with-lease && echo "sync successfull" >> $GITHUB_STEP_SUMMARY || (git diff && git status && exit 1)
          fi

  already-tested:
    name: "all 🏁"
    runs-on: ubuntu-latest
    needs: generate-matrix
    if: ${{ needs.generate-matrix.outputs.skip == 'true' }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Git Config"
        run: |
           git config --global user.name web-flow
           git config --global user.email "noreply@github.com"

      - name: "Rotate tested list"
        run: |
          echo "Sweep complete, rotating tested list..." >> $GITHUB_STEP_SUMMARY
          git mv results/tested results/tested.prev
          git commit -m "cycle complete: rotate tested to tested.prev"
          git push --force-with-lease
