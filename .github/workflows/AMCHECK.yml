name: "AMCHECK"

on:
  repository_dispatch:
    types: [check]

  # Fast path for changed apps: repository_dispatch (or manual dispatch) with
  # what_test set to the changed app names tests only those apps; the hourly
  # sweep covers the remainder. There is no push trigger in this repo because
  # install scripts live in the AM repo, not here.
  workflow_dispatch:
    inputs:
      reset_stats:
        description: "RESET stats"
        required: true
        default: false
        type: boolean
      retest_excluded:
        description: "TEST excluded"
        required: true
        default: false
        type: boolean
      what_test:
        description: "App names: (space between)"
        required: false
        default: ""
        type: string
      how_many:
        description: "Number of apps: (max 500)"
        required: false
        default: ''
        type: integer

  schedule:
    - cron: '0 * * * *'
    # Enable ONLY after a full TOTEST=500 run completes in under 25 minutes wall-clock
    # (read from run duration in the Actions UI) AND owner accepts ~2x runner minutes:
    # - cron: '*/30 * * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  check:
    uses: ./.github/workflows/_amcheck-core.yml
    with:
      totest: 500
      chunk_size: 10
      upload_icons: false
      reset_stats: ${{ inputs.reset_stats == true && 'true' || 'false' }}
      retest_excluded: ${{ inputs.retest_excluded == true && 'true' || 'false' }}
      what_test: ${{ inputs.what_test }}
      how_many: ${{ inputs.how_many }}
    secrets: inherit
